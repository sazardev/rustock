[package]
name = "rustock"
version = "0.5.2"
description = "Rustock — WMS self-hosted: inventario, movimientos y trazabilidad de almacén"
authors = ["Omar Sazar <cerberusprogrammer@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sazardev/rustock"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
thiserror = "2.0.20"
parking_lot = "0.12.5"
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
# `ssl-rustls` en vez de `ssl-openssl`: TLS en Rust puro, sin exigir
# libssl del sistema al compilar ni al desplegar.
tiny_http = { version = "0.12.0", features = ["ssl-rustls"] }
toml = "0.9.8"
base64 = "0.22.1"
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
